</style></head><body><main><header><img src="assets/csched-logo.svg" alt="CSched"><button id="language" aria-label="Switch language">English</button></header>
<h1>The GTFS Missing Link</h1><p data-fr="Choisissez votre version et retrouvez vos outils de préparation GTFS et HASTUS." data-en="Choose a version and open your GTFS and HASTUS preparation tools."></p>
<article class="current"><h2>v__CURRENT_VERSION__ · <span data-fr="Version actuelle" data-en="Current version"></span></h2><p data-fr="Revue visuelle, validations, journal des modifications et sauvegarde du travail." data-en="Visual review, approvals, change log and saved work."></p><a class="action" href="app.html" data-fr="Ouvrir l’application" data-en="Open the application"></a></article>
<article><h2 data-fr="Essayer la revue sur iPad" data-en="Try the review on iPad"></h2><p data-fr="Démonstration fictive inspirée des cas testés avec OC Transpo : aucun identifiant, nom ou emplacement client. Un tutoriel vous accompagne. Les cartes en ligne nécessitent Internet." data-en="Fictional demonstration inspired by cases tested with OC Transpo: no client identifiers, names or locations. Includes a guided tutorial. Online maps require Internet."></p><a id="demo" class="action" href="demo/review-fr.html" data-fr="Ouvrir la démonstration" data-en="Open the demonstration"></a><p data-fr="Les validations restent dans ce navigateur. Téléchargez une copie HTML avant de terminer pour conserver et transmettre votre revue ; la sauvegarde directe dans le même fichier dépend du navigateur." data-en="Approvals stay in this browser. Download an HTML copy before finishing to keep and share your review; saving directly to the same file depends on your browser."></p></article>
<article><h2 data-fr="Revue privée · données réelles" data-en="Private review · real data"></h2><p data-fr="Transférez le rapport HTML OC Transpo sur votre iPad, puis choisissez-le ici. Le fichier reste sur votre appareil : aucun envoi vers GitHub. Le rapport conserve les noms, codes, références et stops réels. Les fonds cartographiques en ligne contactent OpenStreetMap." data-en="Transfer the OC Transpo HTML report to your iPad, then select it here. The file stays on your device: nothing is uploaded to GitHub. The report retains real names, codes, references and stops. Online map backgrounds connect to OpenStreetMap."></p><label for="private-file" data-fr="Choisir mon rapport HTML privé" data-en="Choose my private HTML report"></label><p><input id="private-file" type="file" accept=".html,text/html"></p><a id="private-open" class="action" hidden target="_blank" rel="noopener" data-fr="Ouvrir le rapport sélectionné" data-en="Open selected report"></a><p id="private-name" role="status"></p></article>
<article><h2 data-fr="Espace privé · accès autorisé" data-en="Private workspace · authorized access"></h2><p data-fr="Connexion par e-mail et mot de passe. Les fichiers sont hébergés dans Supabase, hors du dépôt GitHub. L’accès nécessite la vérification de votre e-mail et l’autorisation de l’administrateur." data-en="Sign in with email and password. Files are hosted in Supabase, outside the GitHub repository. Access requires email verification and administrator authorization."></p><a class="action" href="portal.html" data-fr="Se connecter à l’espace privé" data-en="Sign in to the private workspace"></a></article>
<h2 data-fr="Versions précédentes" data-en="Previous versions"></h2><p data-fr="Utilisez une copie de vos sauvegardes avec les anciennes versions. Leurs espaces navigateur sont séparés de la version actuelle." data-en="Use a copy of your workspaces with older versions. Their browser workspaces are separate from the current version."></p>
<div class="archives"><a href="versions/v12.0/">v12.0<small data-fr="Tutoriel et rapports unifiés" data-en="Tutorial and unified reports"></small></a><a href="versions/v11.0/">v11.0<small data-fr="Jours de service et horaires" data-en="Service days and timetables"></small></a><a href="versions/v10.0/">v10.0<small data-fr="Interface épurée" data-en="Clean interface"></small></a></div><footer data-fr="Vos fichiers de travail sont traités localement par votre navigateur. Aucun jeu de données client n’est livré avec l’application." data-en="Your working files are processed locally by your browser. No client dataset is shipped with the application."></footer></main>
<script>let privateUrl;document.getElementById('private-file').onchange=event=>{const file=event.target.files[0],link=document.getElementById('private-open');link.hidden=true;if(privateUrl)URL.revokeObjectURL(privateUrl);if(!file)return;privateUrl=URL.createObjectURL(new Blob([file],{type:'text/html'}));link.href=privateUrl;link.hidden=false;document.getElementById('private-name').textContent=file.name;link.focus()};let language='fr';try{language=localStorage.getItem('gtfs-launch-language')||(navigator.language.startsWith('fr')?'fr':'en')}catch{}function render(){document.documentElement.lang=language;document.querySelectorAll('[data-fr]').forEach(e=>e.textContent=e.dataset[language]);document.getElementById('language').textContent=language==='fr'?'English':'Français';document.getElementById('demo').href='demo/review-'+language+'.html'}document.getElementById('language').onclick=()=>{language=language==='fr'?'en':'fr';try{localStorage.setItem('gtfs-launch-language',language)}catch{}render()};render();</script></body></html>
