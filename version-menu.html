<h1>The GTFS Missing Link</h1><p data-fr="Choisissez votre version et retrouvez vos outils de préparation GTFS et HASTUS." data-en="Choose a version and open your GTFS and HASTUS preparation tools."></p>
<article class="current"><h2>v__CURRENT_VERSION__ · <span data-fr="Version actuelle" data-en="Current version"></span></h2><p data-fr="Revue visuelle, validations, journal des modifications et sauvegarde du travail." data-en="Visual review, approvals, change log and saved work."></p><a class="action" href="app.html" data-fr="Ouvrir l’application" data-en="Open the application"></a>
<details id="release-notes" class="release-notes"><summary data-fr="Notes de version · Les nouveautés depuis la v12" data-en="Release notes · What’s new since v12"></summary>
<p data-fr="La v13 et ses dernières améliorations facilitent l’analyse des places et références HASTUS et la revue interactive avec les clients." data-en="Version 13 and its latest improvements make HASTUS place and reference assessment and interactive client reviews easier."></p>
<h3 data-fr="Une interface mieux organisée" data-en="A better organized interface"></h3>
<ul>
<li data-fr="Workflows séparés : regroupement géographique, cartes et timetables, comparaison des horaires, scheduling units, rapports et exports." data-en="Separate workflows: geographic grouping, route maps and timetables, schedule comparison, scheduling units, reports and exports."></li>
<li data-fr="Menu de démarrage avec accès aux versions précédentes, démonstration fictive et ouverture locale de rapports privés." data-en="Start menu with previous versions, a fictional demonstration and local opening of private reports."></li>
<li data-fr="Reprise automatique de la dernière sauvegarde de l’application ; nom de l’agence et date/heure dans le fichier d’état." data-en="Automatic restoration of the latest application workspace; agency name and date/time in the state filename."></li>
</ul>
<h3 data-fr="Des diagnostics et des cartes plus lisibles" data-en="Clearer diagnostics and maps"></h3>
<ul>
<li data-fr="Références éloignées ou suspectes, places proches sans référence commune et stops à rattacher : fiches détaillées avec distances, seuils, recommandations et statut timing point (TP)." data-en="Distant or suspect references, nearby places without a shared reference and stops to attach: detailed cards with distances, thresholds, recommendations and timing point (TP) status."></li>
<li data-fr="Étiquettes regroupant codes, descriptions et références ; liens en pointillés entre places et références. Dans le rapport HTML, un clic sur une étiquette affiche les stops associés." data-en="Labels combine codes, descriptions and references; dotted lines connect places to their references. In the HTML report, clicking a label displays its associated stops."></li>
<li data-fr="Taille et contenu des étiquettes réglables ; distances à vol d’oiseau masquées, petites ou grandes dans toutes les vues de revue. Filtre TP disponible." data-en="Adjustable label size and content; straight-line distances can be hidden, small or large across all review layouts. A TP filter is available."></li>
<li data-fr="Dans l’application, tous les cas du diagnostic sur une même page, avec recherche et filtres. Détails et cartes chargés à l’ouverture des fiches ; étiquettes adaptées au thème sombre." data-en="In the application, all diagnostic cases appear on one page with search and filters. Details and maps load when cards are opened; labels are adapted to the dark theme."></li>
</ul>
<h3 data-fr="Une revue client plus pratique" data-en="An easier client review"></h3>
<ul>
<li data-fr="Revue plein écran : Carte maximale, Carte ou Comparaison, avec navigation discrète et interface adaptée aux formats tablette. Validation également possible en mode normal ; les cas validés quittent la file à traiter." data-en="Full-screen review: Maximum map, Map or Comparison, with discreet navigation and tablet-sized layouts. Approval is also available in normal mode; approved cases leave the review queue."></li>
<li data-fr="Consultation des places liées puis retour au cas initial. Compte rendu horodaté des validations, annulations et notes, avec suivi avant/après, export CSV et impression PDF. Le récapitulatif des modifications des places inclut les stops et leurs descriptions." data-en="Open linked places and return to the original case. Timestamped log of approvals, reversals and notes, with before/after tracking, CSV export and PDF printing. The place change summary includes stops and their descriptions."></li>
<li data-fr="Brouillon sauvegardé automatiquement dans le navigateur, tutoriel guidé français/anglais et thème Confort visuel aux couleurs plus douces. Enregistrement dans un même fichier après autorisation, si le navigateur le permet." data-en="Automatic browser draft, a guided French/English tutorial and a Visual comfort theme with softer colors. Save to the same file after granting permission, where supported by the browser."></li>
</ul>
<h3 data-fr="Un espace privé" data-en="A private workspace"></h3>
<p data-fr="Portail de connexion et d’administration pour une bibliothèque privée via Supabase, hors du dépôt GitHub. Les accès doivent être configurés et validés avant utilisation avec des données client." data-en="Sign-in and administration portal for a private library through Supabase, outside the GitHub repository. Access must be configured and verified before use with client data."></p>
<p class="release-tip" data-fr="À retenir : régénérez les rapports HTML pour bénéficier des nouveautés. Le brouillon automatique ne remplace pas une copie sauvegardée du rapport. Les validations du diagnostic tracent les décisions de revue sans modifier automatiquement les affectations GTFS/HASTUS. L’écriture directe dépend du navigateur ; les essais tablette simulés restent à compléter sur iPad réel." data-en="Please note: regenerate HTML reports to get the new features. Automatic drafts do not replace a saved report copy. Diagnostic approvals record review decisions without automatically changing GTFS/HASTUS assignments. Direct file saving depends on the browser; simulated tablet tests still require confirmation on a real iPad."></p>
</details></article>
<article><h2 data-fr="Essayer la revue sur iPad" data-en="Try the review on iPad"></h2><p data-fr="Démonstration fictive inspirée des cas testés avec OC Transpo : aucun identifiant, nom ou emplacement client. Un tutoriel vous accompagne. Les cartes en ligne nécessitent Internet." data-en="Fictional demonstration inspired by cases tested with OC Transpo: no client identifiers, names or locations. Includes a guided tutorial. Online maps require Internet."></p><a id="demo" class="action" href="demo/review-fr.html" data-fr="Ouvrir la démonstration" data-en="Open the demonstration"></a><p data-fr="Les validations restent dans ce navigateur. Téléchargez une copie HTML avant de terminer pour conserver et transmettre votre revue ; la sauvegarde directe dans le même fichier dépend du navigateur." data-en="Approvals stay in this browser. Download an HTML copy before finishing to keep and share your review; saving directly to the same file depends on your browser."></p></article>
<article><h2 data-fr="Revue privée · données réelles" data-en="Private review · real data"></h2><p data-fr="Transférez le rapport HTML OC Transpo sur votre iPad, puis choisissez-le ici. Le fichier reste sur votre appareil : aucun envoi vers GitHub. Le rapport conserve les noms, codes, références et stops réels. Les fonds cartographiques en ligne contactent OpenStreetMap." data-en="Transfer the OC Transpo HTML report to your iPad, then select it here. The file stays on your device: nothing is uploaded to GitHub. The report retains real names, codes, references and stops. Online map backgrounds connect to OpenStreetMap."></p><label for="private-file" data-fr="Choisir mon rapport HTML privé" data-en="Choose my private HTML report"></label><p><input id="private-file" type="file" accept=".html,text/html"></p><a id="private-open" class="action" hidden target="_blank" rel="noopener" data-fr="Ouvrir le rapport sélectionné" data-en="Open selected report"></a><p id="private-name" role="status"></p></article>
<article><h2 data-fr="Espace privé · accès autorisé" data-en="Private workspace · authorized access"></h2><p data-fr="Connexion par e-mail et mot de passe. Les fichiers sont hébergés dans Supabase, hors du dépôt GitHub. L’accès nécessite la vérification de votre e-mail et l’autorisation de l’administrateur." data-en="Sign in with email and password. Files are hosted in Supabase, outside the GitHub repository. Access requires email verification and administrator authorization."></p><a class="action" href="portal.html" data-fr="Se connecter à l’espace privé" data-en="Sign in to the private workspace"></a></article>
<h2 data-fr="Versions précédentes" data-en="Previous versions"></h2><p data-fr="Utilisez une copie de vos sauvegardes avec les anciennes versions. Leurs espaces navigateur sont séparés de la version actuelle." data-en="Use a copy of your workspaces with older versions. Their browser workspaces are separate from the current version."></p>
<div class="archives"><a href="versions/v12.0/">v12.0<small data-fr="Tutoriel et rapports unifiés" data-en="Tutorial and unified reports"></small></a><a href="versions/v11.0/">v11.0<small data-fr="Jours de service et horaires" data-en="Service days and timetables"></small></a><a href="versions/v10.0/">v10.0<small data-fr="Interface épurée" data-en="Clean interface"></small></a></div><footer data-fr="Vos fichiers de travail sont traités localement par votre navigateur. Aucun jeu de données client n’est livré avec l’application." data-en="Your working files are processed locally by your browser. No client dataset is shipped with the application."></footer></main>
<script>let privateUrl;document.getElementById('private-file').onchange=event=>{const file=event.target.files[0],link=document.getElementById('private-open');link.hidden=true;if(privateUrl)URL.revokeObjectURL(privateUrl);if(!file)return;privateUrl=URL.createObjectURL(new Blob([file],{type:'text/html'}));link.href=privateUrl;link.hidden=false;document.getElementById('private-name').textContent=file.name;link.focus()};let language='fr';try{language=localStorage.getItem('gtfs-launch-language')||(navigator.language.startsWith('fr')?'fr':'en')}catch{}function render(){document.documentElement.lang=language;document.querySelectorAll('[data-fr]').forEach(e=>e.textContent=e.dataset[language]);document.getElementById('language').textContent=language==='fr'?'English':'Français';document.getElementById('demo').href='demo/review-'+language+'.html'}document.getElementById('language').onclick=()=>{language=language==='fr'?'en':'fr';try{localStorage.setItem('gtfs-launch-language',language)}catch{}render()};render();</script></body></html>
