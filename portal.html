<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src https://wlkneuryxlpuqzmbimax.supabase.co; base-uri 'none'; form-action 'self'; object-src 'none'">
<title>The GTFS Missing Link · Espace privé</title><link rel="stylesheet" href="portal.css?v=1"></head><body>
<header><a href="index.html">← <span data-fr="Accueil" data-en="Home">Accueil</span></a><img src="assets/csched-logo.svg" alt="CSched"><button id="language">English</button></header>
<main><h1 data-fr="Espace privé" data-en="Private workspace">Espace privé</h1>
<p data-fr="Accès réservé aux adresses autorisées. Le compte Supabase du tableau de bord est distinct du compte de cet espace." data-en="Authorized email addresses only. Your Supabase dashboard account is separate from this workspace account."></p>
<p id="status" role="status" aria-live="polite"></p>
<section id="auth-panel"><form id="login-form"><h2 data-fr="Connexion" data-en="Sign in"></h2><label>E-mail<input id="email" type="email" autocomplete="username" required></label><label><span data-fr="Mot de passe" data-en="Password"></span><input id="password" type="password" autocomplete="current-password" required></label><button data-fr="Se connecter" data-en="Sign in"></button></form>
<details><summary data-fr="Première connexion : créer mon compte" data-en="First visit: create my account"></summary><p data-fr="Créer un compte ne donne aucun accès aux fichiers. Votre adresse doit être vérifiée par e-mail ET autorisée par l’administrateur." data-en="Creating an account does not grant file access. Your email must be verified AND authorized by the administrator."></p><form id="signup-form"><label>E-mail<input id="signup-email" type="email" autocomplete="username" required></label><label><span data-fr="Nouveau mot de passe (12 caractères minimum)" data-en="New password (at least 12 characters)"></span><input id="signup-password" type="password" minlength="12" autocomplete="new-password" required></label><button data-fr="Créer mon compte et vérifier mon e-mail" data-en="Create account and verify my email"></button></form></details>
<details><summary data-fr="Mot de passe oublié" data-en="Forgot password"></summary><p data-fr="Demandez un code, puis recopiez les chiffres reçus par e-mail. Ce parcours nécessite le modèle d’e-mail de récupération indiqué dans le guide d’installation." data-en="Request a code, then enter the digits received by email. This flow requires the recovery email template in the setup guide."></p><form id="recover-form"><label>E-mail<input id="recover-email" type="email" required></label><button data-fr="Recevoir un code" data-en="Send a code"></button></form><form id="reset-form"><label data-fr="Code reçu" data-en="Code received"></label><input id="recovery-code" aria-label="Code" inputmode="numeric" pattern="[0-9]{6,10}" required><label><span data-fr="Nouveau mot de passe" data-en="New password"></span><input id="new-password" type="password" minlength="12" autocomplete="new-password" required></label><button data-fr="Changer le mot de passe" data-en="Change password"></button></form></details></section>
<section id="workspace" hidden><div class="toolbar"><strong id="identity"></strong><button id="refresh" data-fr="Actualiser" data-en="Refresh"></button><button id="logout" data-fr="Déconnexion" data-en="Sign out"></button></div>
<h2 data-fr="Fichiers partagés privés" data-en="Private shared files"></h2><p data-fr="Tous les utilisateurs autorisés ont accès à cette bibliothèque. Les copies téléchargées restent sur leurs appareils, même après révocation de l’accès." data-en="All authorized users can access this library. Downloaded copies remain on their devices even after access is revoked."></p><ul id="files"></ul>
<section id="admin-panel" hidden><h2 data-fr="Administration" data-en="Administration"></h2><form id="upload-form"><label><span data-fr="Ajouter un fichier (50 Mo maximum, aucune publication GitHub)" data-en="Add a file (50 MB maximum, never published to GitHub)"></span><input id="upload-file" type="file" accept=".zip,.xlsx,.csv,.txt,.html,.pdf" required></label><button data-fr="Envoyer dans le stockage privé" data-en="Upload to private storage"></button></form>
<h3 data-fr="Autoriser une adresse" data-en="Authorize an email"></h3><form id="member-form"><label>E-mail<input id="member-email" type="email" required></label><button data-fr="Autoriser" data-en="Authorize"></button></form><p data-fr="Communiquez ensuite le lien de cet espace à cette personne. Elle crée son propre compte et vérifie son e-mail. Aucun e-mail d’invitation n’est envoyé par ce bouton." data-en="Then share this workspace link with the person. They create their own account and verify their email. This button does not send an invitation email."></p><ul id="members"></ul></section></section>
<footer data-fr="La session reste uniquement en mémoire : rechargez la page ou fermez cet onglet pour l’effacer. L’accès est contrôlé côté serveur." data-en="The session is held only in memory: reload the page or close this tab to clear it. Access is enforced on the server."></footer></main>
<script src="portal-config.js?v=1"></script><script src="portal.js?v=1"></script></body></html>
